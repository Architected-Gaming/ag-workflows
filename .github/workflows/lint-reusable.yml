name: Lint (Reusable)

on:
  workflow_call:
    secrets:
      DISCORD_LINT_WEBHOOK:
        required: false
      DISCORD_LINT_ERRORS_WEBHOOK:
        required: false
      # AG [I] 27SEP26 - UPDATE - no longer used ("Report to Tetra" removed; the hub fetches the
      # tetra-lint-result artifact). Still declared because every thin caller passes it, and passing
      # an undeclared secret fails the call. Remove after the hub stops seeding it in lint.yml.
      LINT_WEBHOOK_SECRET:
        required: false

jobs:
  lint:
    name: Lint Resource
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # AG [I] 04APR26 - UPDATE - Exclude non-lintable files before lint
      - name: Exclude Non-Lintable Files
        run: |
          fxap=0
          ignore=0

          # 1. Remove FXAP-encrypted files (magic bytes 0x46584150)
          find . -name '*.lua' -not -path './.git/*' | while IFS= read -r f; do
            header=$(head -c4 "$f" | od -An -tx1 | tr -d ' \n')
            if [ "$header" = "46584150" ]; then
              rm -f "$f"
              fxap=$((fxap + 1))
            fi
          done

          # 2. Honor per-repo .lintignore (one glob pattern per line)
          #    Add non-code .lua files here (install snippets, READMEs, etc.)
          # AG [I] 18JUL26 - FIX - space-safe exclusion. The old `for f in $(find ...)` word-split on
          # spaces, so a .lintignore entry like `!requirements/ox_inventory items.lua` was FOUND but
          # never removed (the path split into two bogus tokens, rm no-op'd) — the file survived and
          # failed the lint, defeating the whole exclusion and leaving the Git Ops pull blocked. Trim
          # without xargs (xargs also mangles quotes/backslashes) and iterate find output NUL-delimited
          # so paths containing spaces or globs delete correctly.
          if [ -f .lintignore ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%%#*}"                        # strip trailing comment
              line="${line#"${line%%[![:space:]]*}"}"   # ltrim
              line="${line%"${line##*[![:space:]]}"}"   # rtrim
              [ -z "$line" ] && continue
              while IFS= read -r -d '' f; do
                rm -f "$f"
                ignore=$((ignore + 1))
              done < <(find . -not -path './.git/*' -path "./$line" -print0 2>/dev/null)
            done < .lintignore
          fi

          echo "Excluded: $fxap FXAP, $ignore .lintignore"
      # AG UPDATE END

      - name: Lint
        uses: iLLeniumStudios/fivem-lua-lint-action@v2
        with:
          capture: "junit.xml"
          args: "-t --ignore 1 2 3 4 5 6 --formatter JUnit"
          extra_libs: ox_lib+mysql+qblocales+qbox+qbox_playerdata+qbox_lib

      - name: Generate Lint Report
        if: always()
        uses: mikepenz/action-junit-report@v4
        continue-on-error: true
        with:
          report_paths: "**/junit.xml"
          check_name: Linting Report
          fail_on_failure: true

      - name: Discord Notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_LINT_WEBHOOK }}
          ERRORS_WEBHOOK_URL: ${{ secrets.DISCORD_LINT_ERRORS_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 << 'PYEOF'
          import json, os, re, urllib.request, xml.etree.ElementTree as ET

          # AG [I] 11JUL26 - UPDATE - secrets may hold MULTIPLE newline-separated webhook URLs
          # (Tetra admin joins the list with \n); split + loop so every destination is notified.
          # A single-URL secret is one line -> identical behavior to before.
          webhooks = [u.strip() for u in os.environ.get("WEBHOOK_URL", "").splitlines() if u.strip()]
          errors_webhooks = [u.strip() for u in os.environ.get("ERRORS_WEBHOOK_URL", "").splitlines() if u.strip()]
          # AG UPDATE END

          job_status = os.environ["JOB_STATUS"]
          repo = os.environ["REPO"]
          branch = os.environ["BRANCH"]
          sha = os.environ["SHA"]
          actor = os.environ["ACTOR"]
          run_id = os.environ["RUN_ID"]
          short_sha = sha[:7]

          # AG [I] 04APR26 - UPDATE - Parse both <failure> (lint) and <error> (syntax) elements
          # luacheck JUnit formatter uses <failure> for lint warnings/errors and
          # <error> for fatal errors like syntax errors (F2 code)
          lua_error_re = re.compile(r'\S+\.lua:\d+:\d+:')

          passed = 0
          failed = 0
          errors = []
          try:
              tree = ET.parse("junit.xml")
              for tc in tree.iter("testcase"):
                  # Check both <failure> (lint issues) and <error> (syntax errors)
                  issue = tc.find("failure")
                  if issue is None:
                      issue = tc.find("error")
                  if issue is not None:
                      failed += 1
                      classname = tc.get("classname", "")
                      msg = issue.get("message", "") or (issue.text or "lint error")
                      if len(msg) > 200:
                          msg = msg[:200] + "..."
                      errors.append(f"\u2022 `{classname}`: {msg}")
                  else:
                      passed += 1
          except (FileNotFoundError, ET.ParseError):
              pass

          # Fallback: if job failed but JUnit found nothing, try raw text
          if not errors and job_status != "success":
              try:
                  with open("junit.xml", "r", errors="replace") as jf:
                      for line in jf:
                          line = line.strip()
                          if lua_error_re.search(line):
                              if len(line) > 200:
                                  line = line[:200] + "..."
                              errors.append(f"\u2022 `{line}`")
                              failed += 1
              except FileNotFoundError:
                  pass
              if not errors:
                  errors.append(f"\u2022 Lint failed \u2014 check the [workflow run](https://github.com/{repo}/actions/runs/{run_id}) for details")
                  failed = 1

          # Build description
          if job_status == "success":
              color = 3066993   # green
              status = "\u2705 Passed"
          else:
              color = 15158332  # red
              status = "\u274c Failed"

          lines = [
              f"{status}\n",
              f"**Tests:** {passed} passed" + (f", {failed} failed" if failed else ""),
              f"**Branch:** `{branch}`",
              f"**Commit:** [`{short_sha}`](https://github.com/{repo}/commit/{sha})",
              f"**By:** {actor}",
          ]

          if errors:
              lines.append("")
              lines.append("**Errors:**")
              lines.extend(errors[:10])
              if len(errors) > 10:
                  lines.append(f"... and {len(errors) - 10} more")
              lines.append("")
              lines.append("*False positive? Add a `.lintignore` file to the repo root listing files to skip (one per line).*")

          desc = "\n".join(lines)

          if len(desc) > 4000:
              desc = desc[:4000] + "\n... (truncated)"

          payload = json.dumps({
              "embeds": [{
                  "title": f"Lint \u2014 {repo}",
                  "description": desc,
                  "color": color,
                  "url": f"https://github.com/{repo}/actions/runs/{run_id}"
              }]
          })

          # AG [I] 04APR26 - UPDATE - DISCORD_LINT_WEBHOOK fires on all runs, ERRORS_WEBHOOK on failures only
          def send(wh_url):
              if not wh_url:
                  return
              req = urllib.request.Request(
                  wh_url,
                  data=payload.encode(),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "AG-Lint-Bot/1.0"
                  },
                  method="POST"
              )
              try:
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"::warning::Discord webhook failed: {e}")

          # AG [I] 11JUL26 - UPDATE - loop every configured URL (multi-destination support)
          # Main webhooks: every run (pass + fail)
          for wh in webhooks:
              send(wh)
          # Errors webhooks: failures only (JUnit count OR job-level failure as fallback)
          if failed > 0 or job_status == "failure":
              for wh in errors_webhooks:
                  send(wh)
          # AG UPDATE END
          PYEOF

      # AG [I] 27SEP26 - ADD - the Tetra hub FETCHES this result (tetra-distributed PR #706): on the App's
      # workflow_run it downloads the `tetra-lint-result` artifact, so nothing has to call in to the hub.
      # This is the ONLY way results reach the hub ("Report to Tetra" removed 27SEP26). No junit.xml (the
      # lint step crashed) writes no file: the hub then records a failed run as `fail`.
      - name: Save lint result for Tetra
        if: always()
        run: |
          python3 << 'PYEOF'
          import json, os, xml.etree.ElementTree as ET
          if not os.path.exists("junit.xml"):
              print("No junit.xml, so no Tetra lint result file")
              raise SystemExit(0)
          try:
              tree = ET.parse("junit.xml")
          except ET.ParseError as e:
              print(f"junit.xml unreadable ({e}), so no Tetra lint result file")
              raise SystemExit(0)
          errs = []
          for tc in tree.iter("testcase"):
              issue = tc.find("failure")
              if issue is None:
                  issue = tc.find("error")
              if issue is None:
                  continue
              name = tc.get("classname", tc.get("name", ""))
              msg = (issue.get("message", "") or (issue.text or "")).strip()
              parts = name.split(":")
              errs.append({
                  "file": parts[0] if parts else name,
                  "line": int(parts[1]) if len(parts) > 1 and parts[1].isdigit() else 0,
                  "col": int(parts[2]) if len(parts) > 2 and parts[2].isdigit() else 0,
                  "message": msg[:200],
              })
          with open("tetra-lint-result.json", "w") as f:
              json.dump({"status": "fail" if errs else "pass", "error_count": len(errs), "errors": errs[:200]}, f)
          print(f"Tetra lint result: {'fail' if errs else 'pass'}, {len(errs)} error(s)")
          PYEOF

      - name: Upload lint result for Tetra
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetra-lint-result
          path: tetra-lint-result.json
          retention-days: 3
          if-no-files-found: ignore
      # AG ADD END
